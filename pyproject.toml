[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canoeisati-toolproto_jd268"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告工具调用协议工程师·多机通信的带宽瓶颈相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "canoeisati" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://canoeisati.github.io"
Repository = "https://github.com/canoeisati/toolproto_jd268"
Issues = "https://github.com/canoeisati/toolproto_jd268/issues"

[project.scripts]
toolproto_jd268 = "toolproto_jd268:main"

[tool.setuptools]
py-modules = ["toolproto_jd268"]
